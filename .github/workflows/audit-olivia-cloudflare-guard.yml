name: Audit 0liviA Cloudflare Guard

on:
  push:
    branches:
      - audit/olivia-cloudflare-guard
    paths:
      - .github/workflows/audit-olivia-cloudflare-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify credentials exist
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect Workers account mode
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/workers-settings.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/account-settings")"
          echo "WORKERS_SETTINGS_HTTP=$STATUS"
          if [ "$STATUS" = "200" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/workers-settings.json").read_text())
          result=data.get("result") or {}
          print("WORKERS_SETTINGS_READ=YES")
          print("DEFAULT_USAGE_MODEL="+str(result.get("default_usage_model") or ""))
          PY
          else
            echo "WORKERS_SETTINGS_READ=NO"
          fi

      - name: Inspect Access coverage without exposing account data
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/access-apps.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100")"
          echo "ACCESS_HTTP=$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ACCESS_READ=NO"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/access-apps.json").read_text())
          apps=data.get("result") or []
          target="0livia.simondalmasso44.workers.dev"
          domain_matches=0
          all_workers=0
          worker_destinations=0
          for app in apps:
              if str(app.get("domain") or "").lower()==target:
                  domain_matches += 1
              for dest in app.get("destinations") or []:
                  typ=dest.get("type")
                  if typ=="all_workers":
                      all_workers += 1
                  elif typ=="worker":
                      worker_destinations += 1
          print("ACCESS_READ=YES")
          print(f"ACCESS_APP_COUNT={len(apps)}")
          print(f"OLIVIA_DOMAIN_APP_COUNT={domain_matches}")
          print(f"ALL_WORKERS_GUARD_COUNT={all_workers}")
          print(f"WORKER_DESTINATION_APP_COUNT={worker_destinations}")
          PY


      - name: Count Workers AI bindings without exposing script inventory
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/scripts.json --write-out '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          echo "WORKER_LIST_HTTP=$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WORKER_LIST_READ=NO"
            exit 0
          fi
          python - <<'PY' > /tmp/script-names.txt
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/scripts.json").read_text())
          for item in data.get("result") or []:
              name=item.get("id")
              if name:
                  print(name)
          PY
          TOTAL=0
          AI_COUNT=0
          OLIVIA_AI=NO
          while IFS= read -r SCRIPT; do
            [ -n "$SCRIPT" ] || continue
            TOTAL=$((TOTAL+1))
            ENCODED="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$SCRIPT")"
            S="$(curl --silent --show-error --output /tmp/script-settings.json --write-out '%{http_code}'               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ENCODED/settings")"
            [ "$S" = "200" ] || continue
            HAS_AI="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/script-settings.json").read_text())
          bindings=(data.get("result") or {}).get("bindings") or []
          print("YES" if any(b.get("type")=="ai" for b in bindings if isinstance(b,dict)) else "NO")
          PY
          )"
            if [ "$HAS_AI" = "YES" ]; then
              AI_COUNT=$((AI_COUNT+1))
              if [ "$SCRIPT" = "0livia" ]; then OLIVIA_AI=YES; fi
            fi
          done < /tmp/script-names.txt
          rm -f /tmp/script-names.txt /tmp/script-settings.json /tmp/scripts.json
          echo "WORKER_LIST_READ=YES"
          echo "WORKER_SCRIPT_COUNT=$TOTAL"
          echo "AI_BOUND_SCRIPT_COUNT=$AI_COUNT"
          echo "OLIVIA_HAS_AI_BINDING=$OLIVIA_AI"


      - name: Discover account analytics fields for AI usage
        run: |
          set -euo pipefail
          cat > /tmp/graphql.json <<'JSON'
          {"query":"query { __type(name: \"Account\") { fields { name } } }"}
          JSON
          STATUS="$(curl --silent --show-error --output /tmp/graphql-result.json --write-out '%{http_code}'             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json'             --data @/tmp/graphql.json             "https://api.cloudflare.com/client/v4/graphql")"
          echo "GRAPHQL_HTTP=$STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "GRAPHQL_READ=NO"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/graphql-result.json").read_text())
          fields=((((data.get("data") or {}).get("__type") or {}).get("fields")) or [])
          names=sorted(f.get("name","") for f in fields if isinstance(f,dict))
          matches=[n for n in names if any(k in n.lower() for k in ("ai","neuron","inference","billing","usage"))]
          print("GRAPHQL_READ=YES" if not data.get("errors") else "GRAPHQL_READ=PARTIAL")
          print("AI_ANALYTICS_FIELD_COUNT="+str(len(matches)))
          for name in matches[:40]:
              print("AI_ANALYTICS_FIELD="+name[:160])
          PY
