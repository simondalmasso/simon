name: Deploy 0liviA Full Stack
# 0liviA source commit: 9e74e6d4c88e9dea1e72f34837f43887ac4f2ff1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-olivia-frontend.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-olivia-full-stack
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout 0liviA source
        uses: actions/checkout@v4
        with:
          repository: simondalmasso/0liviA
          ref: arch/gpt-synthesis-v1
          path: olivia

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials are available
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify exact 0liviA source
        run: |
          set -euo pipefail
          test -f olivia/web/index.html
          test -f olivia/cloudflare/worker.mjs
          grep -Fq '0liviA' olivia/web/index.html
          grep -Fq "rec.lang='es-AR'" olivia/web/index.html
          grep -Fq "indexedDB.open" olivia/web/index.html
          grep -Fq 'MAX_CALLS_PER_UTC_DAY = 80' olivia/cloudflare/worker.mjs
          grep -Fq '@cf/qwen/qwen3-30b-a3b-fp8' olivia/cloudflare/worker.mjs

      - name: Create zero-cost full-stack Worker config
        working-directory: olivia
        run: |
          cat > wrangler.toml <<'EOF'
          name = "0livia"
          main = "./cloudflare/worker.mjs"
          compatibility_date = "2026-10-04"
          preview_urls = false

          [ai]
          binding = "AI"

          [[durable_objects.bindings]]
          name = "COST_GUARD"
          class_name = "CostGuard"

          [exports.CostGuard]
          type = "durable-object"
          storage = "sqlite"

          [assets]
          directory = "./web"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/healthz"]
          EOF

      - name: Confirm Cloudflare credentials
        working-directory: olivia
        run: npx --yes wrangler@4.119.0 whoami

      - name: Deploy frontend + zero-cost chat core
        working-directory: olivia
        run: npx --yes wrangler@4.119.0 deploy

      - name: Verify production shell and real chat
        run: |
          set -euo pipefail
          URL='https://0livia.simondalmasso44.workers.dev'
          for i in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 20 "$URL/?deploy_check=$(date +%s)" || true)"
            HEALTH="$(curl --fail --silent --show-error --max-time 20 "$URL/healthz" || true)"
            if printf '%s' "$BODY" | grep -Fq '0liviA' && printf '%s' "$HEALTH" | grep -Fq '"provider_ready":true'; then
              break
            fi
            sleep 5
          done
          printf '%s' "$BODY" | grep -Fq '0liviA'
          printf '%s' "$HEALTH" | grep -Fq '"hard_zero_cost":true'

          curl --fail --silent --show-error --max-time 60             -H 'Content-Type: application/json'             -H "Origin: $URL"             --data '{"messages":[{"role":"user","content":"Respondé solamente OK"}]}'             "$URL/api/chat" > /tmp/olivia-chat.sse

          grep -Fq 'data:' /tmp/olivia-chat.sse
          ! grep -Fq '"error"' /tmp/olivia-chat.sse
          echo "LIVE_OK=YES"
          echo "CHAT_OK=YES"
          echo "ZERO_COST_GUARD=YES"
          echo "URL=$URL/"
