name: Deploy 0liviA Public Shell
# Public demo shell only. No Workers AI, no Durable Object and no model/search quota.
# Source must be an exact green 0liviA commit whose transitional bridge is disabled.

env:
  OLIVIA_SOURCE_SHA: "4ad53fdfd6e1664763c73ea5847582ba2ed99157"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-olivia-frontend.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-olivia-public-shell
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact 0liviA source
        uses: actions/checkout@v4
        with:
          repository: simondalmasso/0liviA
          ref: ${{ env.OLIVIA_SOURCE_SHA }}
          path: olivia

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact fail-closed public shell source
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git -C olivia rev-parse HEAD)" = "$OLIVIA_SOURCE_SHA"
          test -f olivia/web/index.html
          test -f olivia/cloudflare/worker.mjs
          grep -Fq '0liviA — Self-hosted agentic AI workspace' olivia/web/index.html
          grep -Fq 'const TRANSITIONAL_BRIDGE_ENABLED = false;' olivia/cloudflare/worker.mjs
          grep -Fq 'error: "bridge_disabled"' olivia/cloudflare/worker.mjs
          grep -Fq 'const PUBLIC_SHELL_ONLY = true;' olivia/cloudflare/worker.mjs
          grep -Fq 'provider_ready: false' olivia/cloudflare/worker.mjs
          grep -Fq 'inference_enabled: false' olivia/cloudflare/worker.mjs
          grep -Fq 'web_read: false' olivia/cloudflare/worker.mjs

      - name: Create static-shell Worker config
        working-directory: olivia
        run: |
          cat > wrangler.toml <<'EOF'
          name = "0livia"
          main = "./cloudflare/worker.mjs"
          compatibility_date = "2026-10-04"
          compatibility_flags = ["global_fetch_strictly_public"]
          preview_urls = false

          # CostGuard was provisioned by the historical bridge. Keep only the
          # export declaration so Wrangler can reconcile that existing namespace.
          # There is deliberately NO Durable Object binding in this public shell.
          [exports.CostGuard]
          type = "durable-object"
          storage = "sqlite"

          [assets]
          directory = "./web"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*", "/healthz"]
          EOF

      - name: Deploy public shell with AI disabled
        working-directory: olivia
        run: npx --yes wrangler@4.119.0 deploy

      - name: Verify shell is live and inference is disabled
        run: |
          set -euo pipefail
          URL='https://0livia.simondalmasso44.workers.dev'
          BODY=''
          HEALTH=''
          for i in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 20 "$URL/?deploy_check=$GITHUB_RUN_ID" || true)"
            HEALTH="$(curl --fail --silent --show-error --max-time 20 "$URL/healthz" || true)"
            if grep -Fq 'Self-hosted agentic AI workspace' <<<"$BODY"               && grep -Fq '"bridge_enabled":false' <<<"$HEALTH"; then
              break
            fi
            sleep 5
          done
          grep -Fq 'Self-hosted agentic AI workspace' <<<"$BODY"
          grep -Fq '"bridge_enabled":false' <<<"$HEALTH"
          grep -Fq '"provider_ready":false' <<<"$HEALTH"
          grep -Fq '"inference_enabled":false' <<<"$HEALTH"
          grep -Fq '"web_read":false' <<<"$HEALTH"

          STATUS="$(curl --silent --output /tmp/olivia-chat-disabled.json --write-out '%{http_code}'             --max-time 20             -H 'Content-Type: application/json'             -H "Origin: $URL"             --data '{"messages":[{"role":"user","content":"ping"}]}'             "$URL/api/chat")"
          test "$STATUS" = "503"
          grep -Fq '"bridge_disabled"' /tmp/olivia-chat-disabled.json

          echo "PUBLIC_SHELL_OK=YES"
          echo "INFERENCE_DISABLED=YES"
          echo "SOURCE_SHA=$OLIVIA_SOURCE_SHA"
          echo "URL=$URL/"
