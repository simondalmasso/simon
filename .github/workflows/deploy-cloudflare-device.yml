name: Cloudflare Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required Cloudflare secrets are present
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify exact source
        run: npm run verify

      - name: Confirm Cloudflare credentials
        run: npx --yes wrangler@4.119.0 whoami

      - name: Deploy exact source
        run: npx --yes wrangler@4.119.0 deploy

      - name: Verify production
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 20 'https://simon.simondalmasso44.workers.dev/?deploy_check='$(date +%s) || true)"
            if printf '%s' "$BODY" | grep -Fq 'SIMÓN'; then
              echo "LIVE_OK=YES"
              exit 0
            fi
            sleep 5
          done
          echo "LIVE_OK=NO"
          exit 1
